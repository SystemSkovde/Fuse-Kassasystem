<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuse</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 24px;
      margin-bottom: 40px;
    }

    .icons-right span {
      margin-left: 15px;
      cursor: pointer;
    }

    h1 {
      margin: 20px 0;
    }

    .welcome {
      margin-bottom: 40px;
      color: #333;
    }

    .btn {
      display: block;
      width: 80%;
      margin: 10px auto;
      padding: 12px;
      border: 2px solid #333;
      border-radius: 8px;
      background: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover {
      background-color: #e6e6e6;
    }

    .big {
      font-size: 40px !important;
    }

    /* Back-knapp */
    .back {
      position: fixed;
      bottom: 20px;
      left: 20px;

      display: inline-flex;
      align-items: center;
      padding: 8px 10px;
      border: 2px solid #000000;
      border-radius: 6px;
      background-color: #ffffff;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
    }

    .Loggaut {
      position: fixed;
      bottom: 20px;
      right: 20px;

      display: inline-flex;
      align-items: center;
      padding: 8px 10px;
      border: 2px solid #000000;
      border-radius: 6px;
      background-color: #ffffff;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
    }

    .back a,
    .Loggaut a {
      text-decoration: none;
      color: black;
      margin-left: 5px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="top-bar">

      <span class="material-symbols-outlined big">
        help
      </span>

      <div class="icons-right">
       <a id="Home" href="#">
          <span class="material-symbols-outlined big">
            home
          </span>
        </a>
      </div>

    </div>

    <h1>Fuse Account</h1>

    <!-- Knappen för Balans -->
    <button class="btn" onclick="location.href='Balans.html'">
      Balance
    </button>

    <!-- Knappen för Order History -->
    <button class="btn" onclick="location.href='Historik.html'">
      Order history
    </button>

  </div>

  <!-- Back-knappen -->
  <div class="back">
    <span class="material-symbols-outlined smal">
      arrow_back_ios
    </span>

    <a id="Home" href="#">
      Back
    </a>
  </div>

  <!-- Logga ut-knappen -->
  <div class="Loggaut">
    <span class="material-symbols-outlined">
      logout
    </span>

    <a href="Loggain.html">
      Sign out
    </a>
  </div>

  <script>
const user = JSON.parse(localStorage.getItem("user"));

const homeLink = document.getElementById("Home");

if (user.role === "admin") {
    homeLink.href = "AdminHem.html";
} else {
    homeLink.href = "Hem.html";
}
</script>
</body>
</html>
