<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart</title>
<link rel="stylesheet" href="style.css">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    width: 100%;
    overflow-x: hidden;
}

.big {
    font-size: 40px !important;  /* !important tvingar storleken */
}

.h1 {
    text-align: center;
}

.cart-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    table-layout: fixed;
}

.cart-table th,
.cart-table td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: center;
    overflow: hidden;
}

.cart-table td:nth-child(4),
.cart-table th:nth-child(4) {
    width: 140px;
}

.cart-table select {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    padding: 5px;
}

.remove-btn {
    background: #e74c3c;
    color: white;
    border: none;
    padding: 5px 10px;
    cursor: pointer;
    border-radius: 5px;
}

.cart-total {
    margin-top: 15px;
    font-size: 30px;
    text-align: center; /* centrerad total */
}

.pay-button-wrapper {
    margin-top: 10px;
    text-align: center; /* centrerad PAY-knapp */
}

.pay-btn {
    background-color: #27ae60;
    color: white;
    border: none;
    width: 100%;
    max-width: 320px;
    padding: 15px 0;
    font-size: 25px;
    cursor: pointer;
    border-radius: 5px;
}

.pay-btn:hover {
    background-color: #219150;
}

/* Back-knapp */
.back {
    position: fixed;
    bottom: 20px;
    left: 20px;
    display: inline-flex;
    align-items: center;
    padding: 12px 16px;
    border: 2px solid #000000;
    border-radius: 10px;
    background-color: #ffffff;
    cursor: pointer;
    font-weight: bold;
    text-decoration: none;
    z-index: 1000;
}

.top-nav {
    display: flex;
    justify-content: space-between;  /* symbolerna till höger */
    align-items: center;
    gap: 20px;                  /* avstånd mellan symboler */
    padding: 10px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.top-nav .material-symbols-outlined {
    font-size: 28px;
    cursor: pointer;
}

.nav-right {
    display: flex;
    gap: 20px;
    align-items: center;
}

.cart-icon {
    position: relative;
    text-decoration: none;
    color: inherit;
}

.cart-icon .circle {
    position: absolute;
    top: -8px;
    right: -8px;
    background-color: red;
    color: white;
    border-radius: 50%;
    font-size: 14px;
    width: 18px;
    height: 18px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.delete-icon {
    color: red;
    cursor: pointer;
    font-size: 28px;
}

.cart-message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    box-sizing: border-box;
    color: rgb(0, 0, 0);
    padding: 50px;
    border-radius: 14px;
    font-size: 40px;
    font-weight: bold;
    text-align: center;
    display: none;
    z-index: 9999;
}

.popup-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.popup-title {
    font-size: 28px;
    font-weight: bold;
}

.cart-message.error {
    background:rgb(225, 100, 100);
}

.cart-message.success {
    background:#27ae60;
}

.close-msg {
    position: absolute;
    top: 10px;
    right: 10px;
    cursor: pointer;
    font-size: 32px;
}

/* Mobilvy */
@media (max-width: 768px) {
    body {
        font-size: 20px;
    }

    h1 {
        font-size: 34px;
        margin: 20px 0;
    }

    .top-nav {
        padding: 18px 20px;
    }

    .top-nav .material-symbols-outlined,
    .big {
        font-size: 46px !important;
    }

    .cart-icon .circle {
        width: 26px;
        height: 26px;
        font-size: 16px;
        top: -10px;
        right: -10px;
    }

    .cart-table th,
    .cart-table td {
        padding: 8px 4px;
        font-size: 15px;
        word-wrap: break-word;
    }

    .cart-table select {
        width: 100%;
        max-width: 60px;
        padding: 4px;
        font-size: 14px;
    }

    .remove-btn {
        padding: 6px 8px;
        font-size: 14px;
    }

    .delete-icon {
        font-size: 24px;
    }

    .cart-total {
        font-size: 34px;
        margin-top: 25px;
    }

    .pay-btn {
        padding: 18px 60px;
        font-size: 28px;
        border-radius: 10px;
    }

    .back {
        padding: 12px 16px;
        font-size: 20px;
        border-radius: 10px;
    }

    .back a {
        font-size: 20px;
    }

    .smal {
        font-size: 22px !important;
    }

    .cart-message {
        width: 90%;
        padding: 30px 20px;
        font-size: 26px;
    }

    .popup-title {
        font-size: 26px;
    }

    .close-msg {
        font-size: 38px;
    }
}

</style>
</head>

<body>
<nav class="top-nav">
    <a id="Home" href="#">
          <span class="material-symbols-outlined big">
            home
          </span>
        </a>

    <div class="nav-right">
        <a href="cartAlt2.html" class="cart-icon">
            <span class="circle" id="cart-count">0</span>
            <span class="material-symbols-outlined big">shopping_basket</span>
        </a>
            <a href="Minsida.html">
            <span class="material-symbols-outlined big">person</span>
        </a>
    </div>
</nav>

<h1>Shopping Cart</h1>

<!-- Varukorg -->
<div id="cart"></div>

<!--Varkorg felmeddelande-->
<div id="cart-message" class="cart-message">

    <div class="popup-header">
        <span id="cart-message-title" class="popup-title"></span>

        <span class="material-symbols-outlined close-msg" onclick="closeMessage()">
            close
        </span>
    </div>

    <span id="cart-message-text"></span>

</div>

<!-- Script -->
<script src="cartAlt2script.js"></script>

<!-- Back-knappen -->
<div class="back">
    <span class="material-symbols-outlined smal">arrow_back_ios</span>
    <a href="scanna.html">Back</a>
</div>
<script>
const user = JSON.parse(localStorage.getItem("user"));

const homeLink = document.getElementById("Home");

if (user.role === "admin") {
    homeLink.href = "AdminHem.html";
} else {
    homeLink.href = "Hem.html";
}
   </script>

</body>
</html>
