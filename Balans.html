<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balances</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

<style>

body {
  font-family: Arial, sans-serif;
  margin: 0;
  text-align: center;
}

.container {
  max-width: 400px;
  margin: 0 auto;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 24px;
  margin-bottom: 40px;
  padding: 0 20px;
}

.icons-right span {
  margin-left: 15px;
  cursor: pointer;
}

#Home {
  color: black;
}

h1 {
  margin-bottom: 10px;
  font-size: 50px;
}

h2 {
  margin-top: 10px;
  margin-bottom: 10px;
  text-align: center;
  font-size: 20px;
}

.section {
  text-align: center;
  margin-bottom: 30px;
  margin-top: 40px;
}

.item {
  margin: 5px 0;
  display: block;
  font-size: 20px;
}

.back {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
  padding: 0 8px;
  width: 100px;
  height: 30px;
  background-color: white;
  border-radius: 4px;
  border: solid black 0.5px;
}

.smal {
  font-size: 16px !important;
}

button {
  padding: 10px 20px;
  border: 1px solid #999;
  background-color: #eee;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background-color: #ddd;
}

a {
  text-decoration: none;
}

.big {
  font-size: 40px !important;
}

</style>

</head>

<body>

<div class="container">

<div class="top-bar">

<a id="Home" href="#">
  <span class="material-symbols-outlined big">
    home
  </span>
</a>

<span class="material-symbols-outlined big">
  help
</span>

</div>

<h1>Balances</h1>

<div id="balancesContainer"></div>
 
<div class="back">
    <span class="material-symbols-outlined smal">
      arrow_back_ios
    </span>

    <a id="Back" href="#">
      Back
    </a>
  </div>

<script>
  

const user = JSON.parse(localStorage.getItem("user"));
const accounts = JSON.parse(localStorage.getItem("accounts"));
const homeLink = document.getElementById("Home");
const backLink = document.getElementById("Back");

if (user.role === "admin") {
    homeLink.href = "AdminHem.html";
    backLink.href = "AdminHem.html";
} else {
    homeLink.href = "Hem.html";
    backLink.href = "Hem.html";
}

function capitalize(str) {
    return str.charAt(0).toUpperCase() + str.slice(1);
}
const grouped = {};

accounts.forEach(acc => {
    if (!grouped[acc.AccountType]) {
        grouped[acc.AccountType] = [];
    }
    grouped[acc.AccountType].push(acc);
});

let html = "";

Object.entries(grouped).forEach(([type, items]) => {

    html += `
    <div class="section">
        <h2>${capitalize(type)}</h2>
    `;

    items.forEach(item => {
        html += `
        <p class="item">
            ${item.AccountName}: ${item.Balance} kr
        </p>
        `;
    });

    html += `</div>`;
});

document.getElementById("balancesContainer").innerHTML = html;


</script>


</body>
</html>
