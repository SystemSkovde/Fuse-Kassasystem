<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuse Login</title>

<style>

/* =========================
   📱 MOBIL (EXAKT ORIGINAL)
   ========================= */

body {
    background: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-top: 40px;
}

/* Title */
h1 {
    font-size: 70px;
    font-weight: bold;
    color: #222;
    margin-bottom: 30px;
    text-align: center;
}

/* Container */
.container {
    width: 90%;
}

/* Labels */
label {
    font-size: 40px;
    color: black;
    display: block;
    margin-bottom: 6px;
}

/* Inputs */
input {
    width: 100%;
    padding: 14px;
    margin-bottom: 18px;
    border: 1px solid black;
    border-radius: 8px;
    font-size: 40px;
}

/* Login button */
.login-btn {
    display: block;
    width: 50%;
    margin: 20px auto;
    padding: 15px;
    font-size: 40px;
    border: none;
    border-radius: 8px;
    background: #07080a;
    color: white;
    cursor: pointer;
}

/* Forgot button */
.forgot {
    display: block;
    margin: 10px auto;
    padding: 8px 16px;
    font-size: 18px;
    width: auto;
    border: none;
    border-radius: 8px;
    background: #e3e3e3;
    color: #333;
    cursor: pointer;
}

/* knap wrapper */
#knapp {
    margin-top: 100px;
}


/* =========================
   🖥️ DATOR (ENDAST HÄR ÄNDRAS)
   ========================= */

@media (min-width: 768px) {

    body {
        padding-top: 20px;
    }

    h1 {
        font-size: 40px;
        margin-bottom: 20px;
    }

    .container {
        width: 320px;
    }

    label {
        font-size: 16px;
    }

    input {
        font-size: 16px;
        padding: 8px 10px;
        margin-bottom: 12px;
    }

    .login-btn {
        font-size: 16px;
        padding: 10px;
        width: 100%;
        margin: 10px 0;
    }

    .forgot {
        font-size: 14px;
        padding: 6px 12px;
        width: auto; /* 👈 fixar att den inte blir lång */
    }

    #knapp {
        margin-top: 20px;
    }
}

</style>
</head>

<body>

<h1>Fuse</h1>

<form id="loginForm" class="container">

    <label for="cid">CID</label>
    <input required type="text" name="cid" id="cid">

    <label for="pass">Password</label>
    <input required type="password" name="password" id="pass">

    <div id="knapp">
        <input type="submit" value="Log in" class="login-btn">
    </div>

</form>

<button class="forgot">Forgot password?</button>

</body>
</html>
