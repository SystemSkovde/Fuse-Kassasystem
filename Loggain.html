<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fuse Login</title>

<style>
body {
    background: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-top: 40px;
    font-family: Arial, sans-serif;
}

/* Huvudrubrik (standard mobil/normal) */
h1 {
    font-size: 70px;
    font-weight: bold;
    color: #222;
    margin-bottom: 30px;
    text-align: center;
}

/* LABEL */
label {
    font-size: 40px;
    color: black;
    display: block;
    margin-bottom: 6px;
}

/* INPUT */
input {
    width: 100%;
    padding: 14px;
    margin-bottom: 18px;
    border: 1px solid black;
    border-radius: 8px;
    font-size: 40px;
    transition: 0.25s;
}

/* FOKUS */
input:focus {
    border-color: #020305;
    outline: none;
    box-shadow: 0 0 4px rgba(7, 9, 11, 0.3);
}

/* KNAPPAR */
button, .login-btn {
    display: block;
    width: 50%;
    margin: 20px auto;
    padding: 15px;
    font-size: 40px;
    border-radius: 8px;
    cursor: pointer;
    border: none;
}

/* LOGIN */
.login-btn {
    background: #07080a;
    color: white;
}

/* FORGOT */
.forgot {
    background: #e3e3e3;
    color: #333;

    width: 60%;
    padding: 14px;

    font-size: 20px;

    display: block;
    margin: 15px auto;

    border-radius: 8px;
    border: none;
    cursor: pointer;
}
/* CONTAINER */
.container {
    width: 90%;
    flex-direction: column;
    align-items: center;
}

/* =========================
   DESKTOP / MEDIA QUERY
   ========================= */
@media (min-width: 768px) {

    .forgot {
        width: auto;
        min-width: 140px;
        max-width: 180px;

        padding: 8px 12px;
        font-size: 16px;

        display: inline-block;
        margin: 10px auto;

        background: #e3e3e3;
        color: #333;
        border-radius: 8px;
        border: none;
        cursor: pointer;
    }

}

</style>
</head>

<body>

<h1>Fuse</h1>

<form id="loginForm" class="container">

    <label for="cid">CID</label>
    <input required type="text" name="cid" id="cid">

    <label for="pass">Password</label>
    <input required type="password" name="password" id="pass">

    <div id="knapp">
        <input type="submit" value="Log in" class="login-btn">
    </div>

</form>

<button class="forgot">Forgot password?</button>

<script src="loggain.js"></script>
</body>
</html>
