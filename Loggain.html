<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuse Login</title>

<style>
body {
    background: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-top: 30px;
    font-family: Arial, sans-serif;
    padding-top: 15px;

}

/* Huvudrubrik (standard mobil/normal) */
h1 {
    font-size: 42px;
    font-weight: bold;
    color: #222;
    margin-bottom: 20px;
    text-align: center;
}

/* LABEL */
label {
    font-size: 20px;
    color: black;
    display: block;
    margin-bottom: 6px;
}

/* INPUT */
input {
    width: 100%;
    padding: 10px;
    margin-bottom: 18px;
    border: 1px solid black;
    border-radius: 8px;
    font-size: 18px;
    transition: 0.25s;
    box-sizing: border-box;
}

/* FOKUS */
input:focus {
    border-color: #020305;
    outline: none;
    box-shadow: 0 0 4px rgba(7, 9, 11, 0.3);
}

/* KNAPPAR */
button, .login-btn, .forgot {
    display: block;
    width: 90%;
    margin: 12px auto;
    padding: 12px;
    font-size: 18px;
    border-radius: 8px;
    cursor: pointer;
    border: none;
}

/* LOGIN */
.login-btn {
    background: #07080a;
    color: white;
}

/* FORGOT */
.forgot {
    background: #e3e3e3;
    color: #333;
        display: inline-block;
    margin: 10px auto;
    width: 30%;
}

/* CONTAINER */
.container {
    width: 90%;
    flex-direction: column;
    align-items: center;
}

/* =========================
   DESKTOP / MEDIA QUERY
   ========================= */
@media (min-width: 1000px) {

    /* gör hela sidan mer kompakt */
    .container {
        width: 320px;
    }

    h1 {
        font-size: 36px;
        margin-bottom: 20px;
    }

    label {
        font-size: 16px;
        margin-bottom: 4px;
    }

    input {
        font-size: 16px;
        padding: 8px 10px;
        margin-bottom: 12px;
        border-radius: 6px;
    }

    .forgot {
     width: 10%;
        font-size: 16px;
    }

    .login-btn{
   font-size: 16px;
        padding: 10px;
        width: 100%;
        margin: 10px 0;
    }

    #knapp {
        margin-top: 20px;
    }
}

</style>
</head>

<body>

<h1>Fuse</h1>

<form id="loginForm" class="container">

    <label for="cid">CID</label>
    <input required type="text" name="cid" id="cid">

    <label for="pass">Password</label>
    <input required type="password" name="password" id="pass">

    <div id="knapp">
        <input type="submit" value="Log in" class="login-btn">
    </div>

</form>

<button class="forgot">Forgot password?</button>

<script src="loggain.js"></script>
</body>
</html>
