<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fuse Login</title>

<style>

/* =========================
   MOBIL (EXAKT ORIGINAL 
   ========================= */

body {
    background: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-top: 40px;
}

/* Huvudrubrik */
h1 {
    font-size: 70px;
    font-weight: bold;
    color: #222;
    margin-bottom: 30px;
    text-align: center;
}

/* Form-element */
label {
    font-size: 40px;
    color: black;
    display: block;
    margin-bottom: 6px;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 18px;
    border: 1px solid black;
    border-radius: 8px;
    font-size: 40px;
    transition: 0.25s;
}

input:focus {
    border-color: #020305;
    outline: none;
    box-shadow: 0 0 4px rgba(7, 9, 11, 0.3);
}

/* Knappar */
button {
    display: block;
    padding: 15px;
    font-size: 40px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.25s;
    width: 50%;
    margin:20px auto;
}

.login-btn {
    background: #07080a;
    color: white;
}

.login-btn:hover {
    background: #0a0b0c;
}

.forgot {
    background: #e3e3e3;
    color: #333;
}

.forgot:hover {
    background: #d1d1d1;
}

.container{
    width: 90%;
    flex-direction: column;
    align-items: center;
}

#knapp{
    margin-top: 100px;
}


/* =========================
   🖥️ ENDAST DATOR (ÄNDRAR ALLT HÄR)
   ========================= */

@media (min-width: 768px) {

    body {
        padding-top: 20px;
    }

    h1 {
        font-size: 40px;
        margin-bottom: 20px;
    }

    .container {
        width: 320px;
    }

    label {
        font-size: 16px;
        margin-bottom: 4px;
    }

    input {
        font-size: 16px;
        padding: 8px 10px;
        margin-bottom: 12px;
    }

    button {
        font-size: 16px;
        padding: 10px;
        width: 100%;
        margin: 10px 0;
    }

    .login-btn {
        font-size: 16px;
        padding: 10px;
        width: 100%;
    }

    .forgot {
        font-size: 14px;
        padding: 8px 10px;
        width: auto;
        margin: 10px auto;
        display: block;
    }

    #knapp {
        margin-top: 20px;
    }
}
</style>
</head>

<body>

<h1>Fuse</h1>

<form id="loginForm" class="container">

    <label for="cid">CID</label>
    <input required type="text" name="cid" id="cid">

    <label for="pass">Password</label>
    <input required type="password" name="password" id="pass">

    <div id="knapp">
        <input type="submit" value="Log in" class="login-btn">
    </div>

</form>

<button class="forgot">Forgot password?</button>

<script src="loggain.js"></script>
</body>
</html>
