<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fuse Login</title>

<style>

/* =========================
   MOBIL (EXAKT ORIGINAL)
   ========================= */

body {
    background: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-top: 40px;
    font-family: Arial, sans-serif;
}

/* Huvudrubrik */
h1 {
    font-size: 70px;
    font-weight: bold;
    color: #222;
    margin-bottom: 30px;
    text-align: center;
}

/* container (MOBIL oförändrad) */
.container {
    width: 90%;
    flex-direction: column;
    align-items: center;
}

/* labels (MOBIL oförändrad) */
label {
    font-size: 40px;
    color: black;
    display: block;
    margin-bottom: 6px;
}

/* inputs (MOBIL oförändrad) */
input {
    width: 100%;
    padding: 14px;
    margin-bottom: 18px;
    border: 1px solid black;
    border-radius: 8px;
    font-size: 40px;
}

/* login knapp (MOBIL oförändrad) */
.login-btn {
    display: block;
    width: 50%;
    margin: 20px auto;
    padding: 15px;
    font-size: 40px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #07080a;
    color: white;
}

/* forgot (MOBIL oförändrad) */
.forgot {
    display: block;
    margin: 10px auto;
    padding: 8px 16px;
    font-size: 18px;
    width: auto;
    border: none;
    border-radius: 8px;
    background: #e3e3e3;
    color: #333;
    cursor: pointer;
}


/* =========================
   🖥️ ENDAST DATOR
   ========================= */

@media (min-width: 768px) {

    h1 {
        font-size: 36px;
        margin-bottom: 20px;
    }

    .container {
        width: 320px;
    }

    label {
        font-size: 16px;
        margin-bottom: 4px;
    }

    input {
        font-size: 16px;
        padding: 8px 10px;
        margin-bottom: 12px;
        border-radius: 6px;
    }

    .login-btn {
        font-size: 16px;
        padding: 10px;
        width: 100%;
        margin: 10px 0;
    }

    .forgot {
        font-size: 14px;
        padding: 6px 12px;
        width: auto;
    }
}

</style>
</head>

<body>

<h1>Fuse</h1>

<form id="loginForm" class="container">

    <label for="cid">CID</label>
    <input required type="text" name="cid" id="cid">

    <label for="pass">Password</label>
    <input required type="password" name="password" id="pass">

    <div id="knapp">
        <input type="submit" value="Log in" class="login-btn">
    </div>

</form>

<button class="forgot">Forgot password?</button>

<script src="loggain.js"></script>
</body>
</html>
