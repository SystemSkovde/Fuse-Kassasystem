<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  
  <title>Order History</title>
<style>
  .big {
    font-size: 40px !important;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #ffffff;
  }

  .container {
    max-width: 400px;
    margin: 0 auto;
    padding: 20px;
    text-align: center;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 24px;
    margin-bottom: 40px;
  }

  h1 {
    margin: 20px 0;
  }

  .history-section {
    margin-bottom: 40px;
    text-align: left;
  }

  .history-date {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 10px;
    text-align: center;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
  }

  th, td {
    border: 2px solid #333;
    text-align: center;
    padding: 10px;
    font-size: 15px;
  }

  th {
    font-weight: 700;
    background: #f8f8f8;
  }

  .btn {
    display: block;
    width: 80%;
    margin: 10px auto;
    padding: 12px;
    border: 2px solid #333;
    border-radius: 8px;
    background: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
  }

  .btn:hover {
    background-color: #e6e6e6;
  }

  #Home {
    color: black;
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="container">

  <div class="top-bar">

    <a id="Home" href="#">
      <span class="material-symbols-outlined big">home</span>
    </a>
    <span class="material-symbols-outlined big">help</span>
  </div>

  <h1>Order history</h1>

  <div id="historyContainer"></div>

  <button class="btn" onclick="location.href='Minsida.html'">Back</button>

</div>

<script>
const user = JSON.parse(localStorage.getItem("user"));

const homeLink = document.getElementById("Home");

if (user.role === "admin") {
    homeLink.href = "AdminHem.html";
} else {
    homeLink.href = "Hem.html";
}

const historyContainer =
    document.getElementById("historyContainer");

const formData = new FormData();

formData.append(
    "action",
    "getOrderHistory"
);

formData.append(
    "cid",
    user.Cid || user.cid
);

fetch("data.php", {
    method: "POST",
    body: formData
})
.then(r => r.json())
.then(rows => {
  console.log("Svar från data.php:", rows);

    if (!rows.length) {
        historyContainer.innerHTML =
            "<p>You have no previous orders.</p>";
        return;
    }

    let orders = {};

    rows.forEach(row => {

        if (!orders[row.Order_ID]) {

            orders[row.Order_ID] = {
                date: row.Order_date,
                total: row.total_amount,
                status: row.Status,
                items: []
            };
        }

        orders[row.Order_ID].items.push(row);
    });

    let html = "";

    Object.entries(orders).reverse().forEach(([id, order]) => {

        html += `
        <div class="history-section">

            <div class="history-date">
                ${order.date}
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Products</th>
                        <th>Price</th>
                        <th>Amount</th>
                        <th>Account</th>
                    </tr>
                </thead>

                <tbody>
        `;

        order.items.forEach(item => {

            html += `
                <tr>
                    <td>${item.Name}</td>
                    <td>${item.salesPrice} kr</td>
                    <td>${item.Quantity}</td>
                    <td>${item.AccountName}</td>
                </tr>
            `;
        });

        html += `
                </tbody>
            </table>

            <p style="
                margin-top:10px;
                text-align:right;
                font-weight:bold;
            ">
                Total: ${order.total} kr
                (${order.status})
            </p>

        </div>
        `;
    });

    historyContainer.innerHTML = html;
})
.catch(error => {
    console.error(error);

    historyContainer.innerHTML =
        "<p>Could not load order history.</p>";
});
   </script>
</body>
</html>
