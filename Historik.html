<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  
  <title>Order History</title>

  <style>
    .big {
      font-size: 40px !important;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
    }

    .content {
      width: 100%;
      max-width: 800px;
      background: #fff;
      border-radius: 16px;
      padding: 25px 20px 35px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    /* TOP BAR FIX */
    .top-icons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      font-size: 38px;
    }

    .top-icons span {
      cursor: pointer;
      user-select: none;
    }

    #Home {
      color: black;
      text-decoration: none;
    }

    h1 {
      text-align: center;
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 45px;
    }

    .history-section {
      margin-bottom: 55px;
    }

    .history-date {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background: white;
    }

    th,
    td {
      border: 1px solid #d9d9d9;
      text-align: center;
      padding: 16px 10px;
      font-size: 18px;
    }

    th {
      font-weight: 700;
      background: #fafafa;
    }

    .bottom-buttons {
      margin-top: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    .btn {
      min-width: 120px;
      padding: 12px 18px;
      font-size: 18px;
      border: 2px solid #999;
      border-radius: 12px;
      background: #f8f8f8;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover {
      background: #eaeaea;
    }

    @media (max-width: 420px) {
      h1 {
        font-size: 34px;
      }

      .history-date {
        font-size: 24px;
      }

      th, td {
        font-size: 16px;
        padding: 14px 8px;
      }

      .btn {
        font-size: 16px;
        min-width: 110px;
      }
    }
  </style>
</head>

<body>

<div class="content">

  <div class="top-icons">

    <a id="Home" href="#">
      <span class="material-symbols-outlined big">
            help
      </span>
    </div>
  </div>

  <h1>Order history</h1>

    <div id="historyContainer"></div>

  <div class="bottom-buttons">
    <button class="btn" onclick="location.href='Minsida.html'">Back</button>
  </div>

</div>

<script>
const user = JSON.parse(localStorage.getItem("user"));

const homeLink = document.getElementById("Home");

if (user.role === "admin") {
    homeLink.href = "AdminHem.html";
} else {
    homeLink.href = "Hem.html";
}

const historyContainer =
    document.getElementById("historyContainer");

const formData = new FormData();

formData.append(
    "action",
    "getOrderHistory"
);

formData.append(
    "cid",
    user.Cid || user.cid
);

fetch("data.php", {
    method: "POST",
    body: formData
})
.then(r => r.json())
.then(rows => {

    if (!rows.length) {
        historyContainer.innerHTML =
            "<p>You have no previous orders.</p>";
        return;
    }

    let orders = {};

    rows.forEach(row => {

        if (!orders[row.Order_ID]) {

            orders[row.Order_ID] = {
                date: row.Order_date,
                total: row.total_amount,
                status: row.Status,
                items: []
            };
        }

        orders[row.Order_ID].items.push(row);
    });

    let html = "";

    Object.entries(orders).forEach(([id, order]) => {

        html += `
        <div class="history-section">

            <div class="history-date">
                ${order.date}
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Amount</th>
                    </tr>
                </thead>

                <tbody>
        `;

        order.items.forEach(item => {

            html += `
                <tr>
                    <td>${item.Name}</td>
                    <td>${item.salesPrice} kr</td>
                    <td>${item.Quantity}</td>
                </tr>
            `;
        });

        html += `
                </tbody>
            </table>

            <p style="
                margin-top:10px;
                text-align:right;
                font-weight:bold;
            ">
                Total: ${order.total} kr
                (${order.status})
            </p>

        </div>
        `;
    });

    historyContainer.innerHTML = html;
})
.catch(error => {
    console.error(error);

    historyContainer.innerHTML =
        "<p>Could not load order history.</p>";
});
   </script>
</body>
</html>
